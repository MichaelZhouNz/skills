<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
:root{
  --paper:#f6f6f4;
  --surface:#ffffff;
  --surface-2:#f0f0ee;
  --ink:#15171c;
  --ink-2:#3d434f;
  --muted:#666c78;
  --rule:#e0e0dc;
  --rule-2:#cfcfc9;
  --accent:#4a5bd4;
  --accent-soft:#eceefb;
  --add:#3f7d53;
  --add-bg:#eef5f0;
  --del:#b0524f;
  --del-bg:#faeeed;
  --ok:#3f7d53;
  --warn:#a9700f;
  --crit:#b23a32;
  --ok-bg:#eaf2ec;
  --warn-bg:#f8f0e0;
  --crit-bg:#faeceb;
  --shadow:0 1px 2px rgba(21,23,28,.05),0 6px 18px -12px rgba(21,23,28,.25);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14161a;
    --surface:#1b1e24;
    --surface-2:#22262e;
    --ink:#e6e8ec;
    --ink-2:#c3c8d2;
    --muted:#939ba8;
    --rule:#2a2e36;
    --rule-2:#3a3f4a;
    --accent:#8590f0;
    --accent-soft:#232741;
    --add:#6fbf88;
    --add-bg:#1a2620;
    --del:#e08986;
    --del-bg:#2a1d1d;
    --ok:#6fbf88;
    --warn:#d9a441;
    --crit:#e0736a;
    --ok-bg:#1a2620;
    --warn-bg:#2b2418;
    --crit-bg:#2a1c1a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#14161a;
  --surface:#1b1e24;
  --surface-2:#22262e;
  --ink:#e6e8ec;
  --ink-2:#c3c8d2;
  --muted:#939ba8;
  --rule:#2a2e36;
  --rule-2:#3a3f4a;
  --accent:#8590f0;
  --accent-soft:#232741;
  --add:#6fbf88;
  --add-bg:#1a2620;
  --del:#e08986;
  --del-bg:#2a1d1d;
  --ok:#6fbf88;
  --warn:#d9a441;
  --crit:#e0736a;
  --ok-bg:#1a2620;
  --warn-bg:#2b2418;
  --crit-bg:#2a1c1a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  max-width:1440px;
  margin:0 auto;
  padding:32px 24px 72px;
  display:grid;
  grid-template-columns:246px minmax(0,1fr);
  column-gap:30px;
  align-items:start;
}
.masthead{grid-column:1/-1}
.rail{grid-column:1;position:sticky;top:24px;margin-top:20px}
.stream{grid-column:2;display:flex;flex-direction:column;gap:20px;margin-top:20px;min-width:0}

/* ---------- section rail ---------- */
.rail-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.rail-title{
  font-family:var(--mono);font-size:10.5px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
}
.rail-prog{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.rail-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rail-item{
  display:grid;
  grid-template-columns:auto auto minmax(0,1fr) auto;
  align-items:center;
  gap:8px;
  padding:7px 9px 7px 8px;
  border-left:2px solid transparent;
  border-radius:0 4px 4px 0;
  text-decoration:none;
  color:var(--ink-2);
  transition:background .12s,border-color .12s,color .12s;
}
.rail-item:hover{background:var(--surface-2);color:var(--ink)}
.rail-item.active{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.rail-no{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--muted)}
.rail-item.active .rail-no{color:var(--accent)}
.rail-name{font-size:12.5px;line-height:1.35;min-width:0}
.rail-dot{width:7px;height:7px;border-radius:50%;flex:none}
.rail-dot.r-low{background:var(--ok)}
.rail-dot.r-med{background:var(--warn)}
.rail-dot.r-high{background:var(--crit)}
.rail-tick{
  width:13px;height:13px;flex:none;
  border:1.5px solid var(--rule-2);border-radius:3px;
  display:grid;place-items:center;
}
.rail-item.done .rail-tick{background:var(--ok);border-color:var(--ok)}
.rail-item.done .rail-tick::after{
  content:"";width:6px;height:3px;
  border-left:1.6px solid var(--surface);border-bottom:1.6px solid var(--surface);
  transform:rotate(-45deg) translate(1px,-1px);
}
.rail-item.done .rail-name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule-2)}
.rail-reset{
  margin-top:11px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  background:none;border:1px solid var(--rule-2);border-radius:4px;
  color:var(--muted);padding:4px 9px;cursor:pointer;
  transition:color .12s,border-color .12s;
}
.rail-reset:hover{color:var(--ink);border-color:var(--muted)}

/* ---------- viewed toggle ---------- */
.viewed{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;
  color:var(--muted);background:var(--surface);
  border:1px solid var(--rule-2);border-radius:5px;padding:4px 9px;
  transition:color .12s,border-color .12s,background .12s;
}
.viewed:hover{color:var(--ink)}
.viewed input{position:absolute;opacity:0;width:0;height:0}
.vbox{
  width:13px;height:13px;flex:none;
  border:1.5px solid var(--rule-2);border-radius:3px;
  display:grid;place-items:center;
}
.viewed input:focus-visible+.vbox{outline:2px solid var(--accent);outline-offset:2px}
.panel.viewed-on .viewed{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.panel.viewed-on .vbox{background:var(--ok);border-color:var(--ok)}
.panel.viewed-on .vbox::after{
  content:"";width:6px;height:3px;
  border-left:1.6px solid var(--surface);border-bottom:1.6px solid var(--surface);
  transform:rotate(-45deg) translate(1px,-1px);
}
.panel{scroll-margin-top:20px}
.panel.viewed-on>:not(.panel-head){display:none}
.panel.viewed-on .panel-head{background:var(--surface)}
.panel.viewed-on .sec-title{color:var(--muted)}
.panel.viewed-on .seg.sm{display:none}

@media (max-width:1040px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .masthead,.rail,.stream{grid-column:1}
  .rail{position:static;margin-top:18px}
  .rail-list{flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:6px}
  .rail-list li{flex:0 0 auto}
  .rail-item{border-left:0;border-bottom:2px solid transparent;border-radius:4px}
  .rail-item.active{border-left:0;border-bottom-color:var(--accent)}
  .rail-name{max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- header ---------- */
.masthead{
  display:flex;
  flex-direction:column;
  gap:14px;
  padding-bottom:20px;
  border-bottom:2px solid var(--rule-2);
}
.eyebrow{
  font-family:var(--mono);
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--accent);
}
h1{
  margin:0;
  font-size:27px;
  font-weight:600;
  line-height:1.25;
  letter-spacing:-.015em;
  text-wrap:balance;
}
h1 .kind{font-family:var(--mono);font-weight:500;color:var(--muted)}
.meta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px 16px;
  font-size:13px;
  color:var(--muted);
}
.meta .who{color:var(--ink-2);font-weight:500}
.meta code{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.stat{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.stat .plus{color:var(--add);font-weight:500}
.stat .minus{color:var(--del);font-weight:500}
.state{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:.08em;
  padding:2px 7px;
  border-radius:3px;
  background:var(--ok-bg);
  color:var(--ok);
}

.globalbar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding-top:4px;
}
.globalbar .hint{font-size:12.5px;color:var(--muted)}

/* ---------- segmented voice toggle ---------- */
.seg{
  display:inline-flex;
  border:1px solid var(--rule-2);
  border-radius:5px;
  overflow:hidden;
  background:var(--surface);
}
.seg button{
  font-family:var(--mono);
  font-size:11.5px;
  font-weight:500;
  letter-spacing:.04em;
  padding:5px 11px;
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  transition:background .12s,color .12s;
}
.seg button+button{border-left:1px solid var(--rule-2)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.seg.sm button{font-size:11px;padding:3px 9px}

/* ---------- panel ---------- */
.panel{
  background:var(--surface);
  border:1px solid var(--rule);
  border-radius:8px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.panel-head{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
  padding:14px 18px;
  border-bottom:1px solid var(--rule);
  background:var(--surface-2);
}
.sec-no{
  font-family:var(--mono);
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  letter-spacing:.02em;
}
.sec-title{
  font-size:16px;
  font-weight:600;
  letter-spacing:-.01em;
  margin:0;
  flex:1 1 320px;
  min-width:0;
}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:3px 8px;
  border-radius:3px;
  white-space:nowrap;
}
.badge.crux{background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.badge.r-low{background:var(--ok-bg);color:var(--ok)}
.badge.r-med{background:var(--warn-bg);color:var(--warn)}
.badge.r-high{background:var(--crit-bg);color:var(--crit)}
.badge.mech{background:var(--surface);color:var(--muted);border:1px solid var(--rule-2)}

.split{
  display:grid;
  grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);
  gap:0;
}
.split>*{padding:16px 18px}
.split .right{border-left:1px solid var(--rule)}
@media (max-width:900px){
  .split{grid-template-columns:minmax(0,1fr)}
  .split .right{border-left:0;border-top:1px solid var(--rule)}
}

.lbl{
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:9px;
}
.filepath{
  font-family:var(--mono);
  font-size:11.5px;
  color:var(--ink-2);
  word-break:break-all;
  text-transform:none;
  letter-spacing:0;
  font-weight:400;
}

/* ---------- diff ---------- */
.diff{
  border:1px solid var(--rule);
  border-radius:5px;
  overflow-x:auto;
  background:var(--paper);
}
.diff table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px;line-height:1.62}
.diff td{padding:0 10px 0 0;white-space:pre;vertical-align:top}
.diff td.ln{
  width:1%;
  padding:0 10px;
  text-align:right;
  color:var(--muted);
  opacity:.65;
  font-variant-numeric:tabular-nums;
  user-select:none;
  border-right:1px solid var(--rule);
}
.diff tr.hunk td{
  background:var(--surface-2);
  color:var(--muted);
  font-size:11.5px;
  padding-top:3px;
  padding-bottom:3px;
  white-space:pre-wrap;
}
.diff tr.add td:last-child{background:var(--add-bg);color:var(--add);box-shadow:inset 3px 0 0 var(--add)}
.diff tr.del td:last-child{background:var(--del-bg);color:var(--del);box-shadow:inset 3px 0 0 var(--del)}
.diff tr.ctx td:last-child{color:var(--ink-2)}
.diff td:last-child{padding-left:8px}

/* ---------- explanation ---------- */
.voice p{margin:0 0 10px}
.voice p:last-child{margin-bottom:0}
.voice code{
  font-family:var(--mono);
  font-size:12.5px;
  background:var(--surface-2);
  padding:1px 4px;
  border-radius:3px;
  color:var(--ink);
}
[data-voice="proper"] .v-eli{display:none}
[data-voice="eli"] .v-proper{display:none}

/* ---------- TL;DR ---------- */
.tldr{
  grid-column:2;
  background:var(--accent-soft);
  border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);
  border-left:3px solid var(--accent);
  border-radius:8px;
  padding:16px 18px 18px;
}
.tldr-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin-bottom:12px;
}
.tldr-head .sumlbl{color:var(--accent)}
.tldr-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);
  gap:18px;
  align-items:start;
}
@media (max-width:900px){.tldr-grid{grid-template-columns:minmax(0,1fr)}}
.tldr .voice p{margin:0 0 10px}
.tldr .voice p:last-child{margin-bottom:0}
.tldr .voice code{background:var(--surface)}
pre.dia{
  font-family:var(--mono);
  font-size:12px;
  line-height:1.75;
  margin:0;
  padding:14px 16px;
  border:1px solid var(--rule);
  border-radius:6px;
  background:var(--surface);
  color:var(--ink-2);
  overflow-x:auto;
  white-space:pre;
}
pre.dia .hi{color:var(--accent);font-weight:500}
pre.dia .mut{color:var(--muted)}
pre.dia .ok{color:var(--add)}
pre.dia .bad{color:var(--del)}
.rail-top{grid-template-columns:minmax(0,1fr)}
.rail-top .rail-name{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

.delta{
  margin-top:14px;
  border-top:1px dashed var(--rule-2);
  padding-top:12px;
}
.delta-rows{display:flex;flex-direction:column;gap:6px}
.delta-row{display:flex;gap:10px;align-items:baseline;font-family:var(--mono);font-size:12px;flex-wrap:wrap}
.delta-row .k{
  color:var(--muted);
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  font-size:10px;
  width:34px;
  flex:none;
}
.delta-row.was .v{color:var(--del)}
.delta-row.now .v{color:var(--add)}
.delta-row .v{word-break:break-word}

/* ---------- review ---------- */
.stripe{
  padding:14px 18px;
  border-top:1px solid var(--rule);
}
.review-list{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.review{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  gap:10px 12px;
  padding:12px 14px;
  border-radius:5px;
  border:1px solid var(--rule);
  background:var(--paper);
}
.review.sev-warn{border-left:3px solid var(--warn)}
.review.sev-gap{border-left:3px solid var(--accent)}
.review.sev-ok{border-left:3px solid var(--ok)}
.review .mark{
  font-family:var(--mono);
  font-size:13px;
  font-weight:700;
  line-height:1.5;
}
.review.sev-warn .mark{color:var(--warn)}
.review.sev-gap .mark{color:var(--accent)}
.review.sev-ok .mark{color:var(--ok)}
.review .body{min-width:0}
.review h4{
  margin:0 0 6px;
  font-size:13.5px;
  font-weight:600;
  letter-spacing:-.005em;
}
.review dl{margin:0;display:flex;flex-direction:column;gap:5px}
.review dt{
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--muted);
}
.review dd{margin:0;font-size:13.5px;color:var(--ink-2)}
.review code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 4px;border-radius:3px;color:var(--ink)}

/* example fix code inside a How */
pre.fix{
  font-family:var(--mono);
  font-size:12px;
  line-height:1.62;
  margin:8px 0 0;
  padding:10px 12px;
  border:1px solid var(--rule);
  border-left:3px solid var(--add);
  border-radius:4px;
  background:var(--paper);
  color:var(--ink);
  overflow-x:auto;
  white-space:pre;
}
pre.fix .cm{color:var(--muted);font-style:normal}
pre.fix .new{color:var(--add)}
pre.fix .cut{color:var(--del);text-decoration:line-through;text-decoration-thickness:1px}

/* collapsible review */
details.foldbox{border-top:1px solid var(--rule)}
details.foldbox>summary{
  list-style:none;
  cursor:pointer;
  padding:13px 18px;
  display:flex;
  align-items:center;
  gap:11px;
  user-select:none;
}
details.foldbox>summary::-webkit-details-marker{display:none}
details.foldbox>summary:hover .sumlbl{color:var(--ink)}
.chev{
  width:8px;height:8px;flex:none;margin-left:2px;
  border-right:1.6px solid var(--muted);
  border-bottom:1.6px solid var(--muted);
  transform:rotate(-45deg);
  transition:transform .15s ease;
}
details.foldbox[open]>summary .chev{transform:rotate(45deg)}
.sumlbl{
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
  transition:color .12s;
}
.counts{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.count{
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  padding:2px 7px;
  border-radius:3px;
  white-space:nowrap;
}
.count.c-warn{background:var(--warn-bg);color:var(--warn)}
.count.c-gap{background:var(--accent-soft);color:var(--accent)}
.count.c-ok{background:var(--ok-bg);color:var(--ok)}
.count.c-mute{background:var(--surface-2);color:var(--muted)}
.foldbody{padding:0 18px 16px}
.foldbody .review-list{margin-top:0}

/* ---------- callers ---------- */
.callers{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.callers th{
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--muted);
  text-align:left;
  padding:0 12px 7px 0;
  border-bottom:1px solid var(--rule);
  white-space:nowrap;
}
.callers td{padding:8px 12px 8px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.callers tr:last-child td{border-bottom:0}
.callers .site{font-family:var(--mono);font-size:12px;color:var(--ink);word-break:break-all}
.callers .pkg{font-size:12.5px;color:var(--muted);white-space:nowrap}
.callers .note{font-size:12.5px;color:var(--muted)}
.reach{
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  padding:2px 7px;
  border-radius:3px;
  white-space:nowrap;
}
.reach.yes{background:var(--warn-bg);color:var(--warn)}
.reach.no{background:var(--surface-2);color:var(--muted)}
.reach.na{background:var(--surface-2);color:var(--muted);opacity:.7}
.callers tr.unreach .site,.callers tr.unreach .pkg{opacity:.6}
.tablewrap{overflow-x:auto}

/* ---------- symbols ---------- */
.symbols{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.sym{
  font-family:var(--mono);
  font-size:11.5px;
  padding:3px 9px;
  border-radius:3px;
  border:1px solid var(--rule-2);
  background:var(--paper);
  color:var(--ink-2);
}
.sym .k{color:var(--muted);margin-right:6px;font-size:10px;letter-spacing:.06em;text-transform:uppercase}

footer.note{
  font-size:12.5px;
  color:var(--muted);
  border-top:1px solid var(--rule);
  padding-top:16px;
  line-height:1.7;
}
footer.note strong{color:var(--ink-2);font-weight:600}
footer.note code{font-family:var(--mono);font-size:12px}
</style>

{{BODY}}
<script>
(function(){
  var VKEY = "pr-brief-voice";
  var SKEY = "pr-brief-viewed:" + document.title;

  var wrap = document.querySelector(".wrap");
  var panels = Array.prototype.slice.call(wrap.querySelectorAll(".panel"));
  var globalSeg = document.getElementById("globalseg");
  var footer = wrap.querySelector("footer.note");
  var tldr = wrap.querySelector(".tldr");
  var voiceHosts = Array.prototype.slice.call(wrap.querySelectorAll("[data-voice]"));
  if (tldr) { tldr.id = "tldr"; }

  function read(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
  function write(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---------- 1. voice toggles ---------- */
  function paint(seg, v){
    Array.prototype.forEach.call(seg.querySelectorAll("button"), function(b){
      b.setAttribute("aria-pressed", String(b.dataset.v === v));
    });
  }
  function setVoice(panel, v){
    panel.setAttribute("data-voice", v);
    var seg = panel.querySelector(".seg");
    if (seg) { paint(seg, v); }
  }
  function setVoiceAll(v){
    voiceHosts.forEach(function(p){ setVoice(p, v); });
    paint(globalSeg, v);
    write(VKEY, v);
  }
  globalSeg.addEventListener("click", function(e){
    var b = e.target.closest("button");
    if (b) { setVoiceAll(b.dataset.v); }
  });
  voiceHosts.forEach(function(host){
    var seg = host.querySelector(".seg");
    if (!seg) { return; }
    seg.addEventListener("click", function(e){
      var b = e.target.closest("button");
      if (b) { setVoice(host, b.dataset.v); }
    });
  });

  /* ---------- 2. restructure into rail + stream ---------- */
  var stream = document.createElement("div");
  stream.className = "stream";
  if (tldr) { stream.appendChild(tldr); }
  panels.forEach(function(p){ stream.appendChild(p); });
  if (footer) { stream.appendChild(footer); }

  var rail = document.createElement("nav");
  rail.className = "rail";
  rail.setAttribute("aria-label", "Sections");
  rail.innerHTML =
    '<div class="rail-head">' +
      '<span class="rail-title">Sections</span>' +
      '<span class="rail-prog"><span class="pdone">0</span>/' + panels.length + ' viewed</span>' +
    '</div>' +
    '<ol class="rail-list"></ol>' +
    '<button type="button" class="rail-reset" hidden>Reset viewed</button>';

  wrap.appendChild(rail);
  wrap.appendChild(stream);

  var list = rail.querySelector(".rail-list");
  var prog = rail.querySelector(".pdone");
  var reset = rail.querySelector(".rail-reset");

  var topLink = null;
  if (tldr) {
    var topLi = document.createElement("li");
    topLink = document.createElement("a");
    topLink.className = "rail-item rail-top";
    topLink.href = "#tldr";
    topLink.innerHTML = '<span class="rail-name">TL;DR</span>';
    topLi.appendChild(topLink);
    list.appendChild(topLi);
  }

  /* ---------- 3. build rail items + viewed checkboxes ---------- */
  var seen = {};
  (function(){
    var raw = read(SKEY);
    if (!raw) { return; }
    try { (JSON.parse(raw) || []).forEach(function(id){ seen[id] = true; }); } catch (e) {}
  })();

  var links = [];

  panels.forEach(function(panel, i){
    var id = "sec-" + (i + 1);
    panel.id = id;

    var noEl = panel.querySelector(".sec-no");
    var titleEl = panel.querySelector(".sec-title");
    var riskEl = panel.querySelector(".badge.r-low, .badge.r-med, .badge.r-high");
    var risk = riskEl ? (riskEl.className.match(/r-(?:low|med|high)/) || [""])[0] : "";

    var li = document.createElement("li");
    var a = document.createElement("a");
    a.className = "rail-item";
    a.href = "#" + id;
    a.innerHTML =
      '<span class="rail-tick" aria-hidden="true"></span>' +
      '<span class="rail-no"></span>' +
      '<span class="rail-name"></span>' +
      (risk ? '<span class="rail-dot ' + risk + '" aria-hidden="true"></span>' : '<span></span>');
    a.querySelector(".rail-no").textContent = noEl ? noEl.textContent : "S" + (i + 1);
    a.querySelector(".rail-name").textContent = titleEl ? titleEl.textContent : "Section " + (i + 1);
    li.appendChild(a);
    list.appendChild(li);
    links.push(a);

    var label = document.createElement("label");
    label.className = "viewed";
    label.innerHTML = '<input type="checkbox"><span class="vbox" aria-hidden="true"></span>Viewed';
    var box = label.querySelector("input");
    box.setAttribute("aria-label", "Mark section " + (i + 1) + " as viewed");
    var head = panel.querySelector(".panel-head");
    if (head) { head.appendChild(label); }

    box.addEventListener("change", function(){
      apply(id, panel, a, box.checked);
      persist();
      refresh();
    });

    apply(id, panel, a, !!seen[id]);
    box.checked = !!seen[id];
  });

  function apply(id, panel, link, on){
    seen[id] = on;
    panel.classList.toggle("viewed-on", on);
    link.classList.toggle("done", on);
  }

  function persist(){
    write(SKEY, JSON.stringify(Object.keys(seen).filter(function(k){ return seen[k]; })));
  }

  function refresh(){
    var n = Object.keys(seen).filter(function(k){ return seen[k]; }).length;
    prog.textContent = String(n);
    reset.hidden = n === 0;
  }

  reset.addEventListener("click", function(){
    panels.forEach(function(panel, i){
      var id = "sec-" + (i + 1);
      var box = panel.querySelector(".viewed input");
      if (box) { box.checked = false; }
      apply(id, panel, links[i], false);
    });
    persist();
    refresh();
  });

  refresh();

  /* ---------- 4. smooth scroll + scroll spy ---------- */
  var targets = panels.slice();
  var navLinks = links.slice();
  if (tldr && topLink) { targets.unshift(tldr); navLinks.unshift(topLink); }

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  navLinks.forEach(function(a, i){
    a.addEventListener("click", function(e){
      e.preventDefault();
      targets[i].scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
      history.replaceState(null, "", a.getAttribute("href"));
    });
  });

  if ("IntersectionObserver" in window) {
    var visible = {};
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){ visible[en.target.id] = en.isIntersecting; });
      var active = -1;
      targets.forEach(function(p, i){ if (active < 0 && visible[p.id]) { active = i; } });
      navLinks.forEach(function(a, i){ a.classList.toggle("active", i === active); });
    }, { rootMargin: "-15% 0px -70% 0px", threshold: 0 });
    targets.forEach(function(p){ io.observe(p); });
  }

  /* ---------- 5. restore voice ---------- */
  var savedVoice = read(VKEY);
  setVoiceAll(savedVoice === "eli" || savedVoice === "proper" ? savedVoice : "proper");
})();
</script>
